name: GoDaddy production check
on:
  push:
    branches: [main, codex/godaddy-conversion]
  pull_request:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev
      - run: npm run build
      - run: node scripts/test-godaddy.mjs
