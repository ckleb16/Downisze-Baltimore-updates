name: GoDaddy production check
on:
  push:
    branches: [main, codex/godaddy-conversion, 'codex/prd-*']
  pull_request:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev
      - run: npm run build
      - run: node --experimental-strip-types scripts/test-canonical-redirects.mjs
      - run: node scripts/test-domain-redirects.mjs
      - run: node --experimental-strip-types scripts/test-performance-resources.mjs
      - run: node scripts/test-local-fonts.mjs
      - run: node scripts/test-godaddy.mjs
